[package]
name = "chakracore-sys"
version = "0.1.0"
edition = "2024"
links = "chakracore-sys"

[dependencies]
anyhow = "1.0.104"
cxx = { version = "1.0.205", features = ["c++20"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync"] }
tracing = "0.1.44"
widestring = "1.2.1"

[build-dependencies]
cmake = "0.1.58"
cxx-build = { version = "1.0.205", features = ["parallel"] }

[features]
compile-cpp = []
optimized-tests = []
