[package]
name = "chakracore-sys"
version = "0.1.0"
edition = "2024"
links = "chakracore-sys"

[dependencies]
cxx = { version = "1.0.199", features = ["c++20"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing = "0.1.44"
widestring = "1.2.1"

[build-dependencies]
cmake = "0.1.58"
cxx-build = { version = "1.0.199", features = ["parallel"] }

[features]
compile-cpp = []
optimized-tests = []
